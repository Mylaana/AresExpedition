<ng-container *ngIf="builders && currentEvent">
	<app-card-builder *ngFor="let builder of builders"
		#builder
		[cardBuilder]="builder"
		[projectFilter]="currentEvent.getSelectorFilter()"
		[cardSize]="cardSize"
		[discount]="currentEvent.getCurrentBuilderDiscount()"
		(cardBuilderListButtonClicked)="onCardBuilderButtonClicked($event)"
		(alternativePayButtonClicked)="onAlternativePayButtonClicked($event)">
	</app-card-builder>
</ng-container>
