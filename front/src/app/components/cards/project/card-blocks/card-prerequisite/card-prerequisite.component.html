<div [ngClass]="['wrapper-prerequisite-summary', prerequisiteTresholdType??'', cardSize, getTresholdType()]">
	<app-text-with-image class="summary-text" *ngIf="prerequisiteSummary" [rawText]="prerequisiteSummary" [cardSize]="cardSize" [context]="'cardPrerequisite'"></app-text-with-image>
	<div class="wrapper-requirement-valid-icon"
		*ngIf="isDisplayIcon()">
		<img *ngIf="isPrerequisiteOk()" src="/assets/other/ready.png" alt="">
		<img *ngIf="!isPrerequisiteOk()" src="/assets/other/cancel_circle.png" alt="">
	</div>
	<div class="wrapper-background-color"
		*ngIf="getBackgroundColors().length>0">
		<div *ngFor="let c of getBackgroundColors()" [ngClass]="['background-box-color' ,c, getBackgroundColors()[getBackgroundColors().length-1]===c?'last':'']"></div>
	</div>
</div>
<div [ngClass]="['wrapper-prerequisite-text shadowed-text' , prerequisiteTresholdType??'', cardSize, getPrerequisiteTextStyle()]">
	<app-text-with-image *ngIf="prerequisiteText" [rawText]="prerequisiteText" [cardSize]="cardSize" [context]="'cardTextAndIcon'"></app-text-with-image>
</div>
